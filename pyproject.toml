[build-system]
requires = [
    "setuptools>=61",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "openntn"
version = "2.0.0.dev1"
description = "An extension of the Sionna framework with 3GPP TR38.811 non-terrestrial-network channel models"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Tim Due", email = "duee@ant.uni-bremen.de" },
    { name = "Louis Lagona", email = "lagona@ant.uni-bremen.de" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Telecommunications Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications",
    "Topic :: Scientific/Engineering",
]
# The lower bounds of torch, numpy and matplotlib are those of Sionna 2.0, which
# requires them as well. matplotlib is used only by the plotting methods.
dependencies = [
    "sionna>=2.0.1,<3.0",
    "torch>=2.9.1",
    "numpy>=2.2.6",
    "matplotlib>=3.10.8",
]

[project.optional-dependencies]
test = ["pytest>=9.0"]

[project.urls]
Homepage = "https://github.com/ant-uni-bremen/OpenNTN"
Source = "https://github.com/ant-uni-bremen/OpenNTN"
Issues = "https://github.com/ant-uni-bremen/OpenNTN/issues"

[tool.setuptools.packages.find]
include = ["openntn*"]
exclude = ["test*", "example*"]

[tool.setuptools.package-data]
openntn = ["models/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
xfail_strict = true
addopts = ["--strict-markers"]
markers = [
    "gpu: needs a CUDA GPU; skipped when none is visible",
    "slow: takes about a second or more on a laptop CPU; deselect with -m 'not slow'",
    "reference: compares with the stored reference outputs, which are reproducible only in the environment of tests/reference_outputs/environment.json; deselect with -m 'not reference'",
]
