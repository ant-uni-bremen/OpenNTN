[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openntn"
version = "2.0.0"
description = "An extension of the Sionna framework with 3GPP TR 38.811 non-terrestrial network channel models"
readme = "README.md"
requires-python = ">=3.11"
keywords = [
    "3GPP TR 38.811",
    "non-terrestrial networks",
    "channel models",
    "satellite communications",
    "Sionna",
    "PyTorch",
]
# Files derived from Sionna are Apache-2.0, the others MIT (README.md, section Licence).
license = "MIT AND Apache-2.0"
license-files = ["LICENSE", "LICENSE-APACHE"]
authors = [
    { name = "Louis Lagona" },
    { name = "Tim Düe" },
]
maintainers = [
    { name = "Louis Lagona", email = "lagona@ant.uni-bremen.de" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Telecommunications Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications",
    "Topic :: Scientific/Engineering",
]
# The lower bounds of torch, numpy and matplotlib are those of Sionna 2.0, which
# requires them as well. matplotlib is used only by the plotting methods.
dependencies = [
    "sionna>=2.0.1,<3.0",
    "torch>=2.9.1",
    "numpy>=2.2.6",
    "matplotlib>=3.10.8",
]

[project.optional-dependencies]
test = ["pytest>=9.0", "mpmath>=1.3"]

[project.urls]
Homepage = "https://github.com/ant-uni-bremen/OpenNTN"
Source = "https://github.com/ant-uni-bremen/OpenNTN"
Issues = "https://github.com/ant-uni-bremen/OpenNTN/issues"
Changelog = "https://github.com/ant-uni-bremen/OpenNTN/blob/v2.0.0/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["openntn*"]
exclude = ["test*", "example*"]

[tool.setuptools.package-data]
openntn = ["models/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
xfail_strict = true
addopts = ["--strict-markers"]
markers = [
    "gpu: needs a CUDA GPU; skipped when none is visible",
    "slow: takes about a second or more on a laptop CPU; deselect with -m 'not slow'",
    "reference: compares with the stored reference outputs, which are reproducible only in the environment of tests/reference_outputs/environment.json; deselect with -m 'not reference'",
]
