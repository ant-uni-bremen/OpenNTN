name: Release

# A pushed tag v<version> builds the sdist and the wheel once and publishes them through
# PyPI Trusted Publishing:
# - development versions (.devN) go to TestPyPI only;
# - alpha, beta, release candidate and final versions go to TestPyPI, then to PyPI.
#   The environment pypi requires the maintainer's approval; the PyPI job also runs
#   when the TestPyPI job failed (see the job pypi).
# Push release tags one at a time: GitHub creates no push event when more than three
# tags are pushed at once.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# The runner image is pinned for the 2.0.0 release window, as in ci.yml.
env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build and check the distributions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
      dev: ${{ steps.version.outputs.dev }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the build tools
        run: python -m pip install --upgrade pip build twine packaging
      - name: Build
        run: python -m build
      - name: Check the distributions
        run: |
          ls -l dist/
          twine check --strict dist/*
      - name: Check the version against the tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python -I -c '
          import os
          import pathlib
          import tarfile
          import zipfile
          from email.parser import HeaderParser
          from packaging.version import Version

          dist = pathlib.Path("dist")
          wheels = sorted(dist.glob("*.whl"))
          sdists = sorted(dist.glob("*.tar.gz"))
          assert len(wheels) == 1 and len(sdists) == 1, f"expected one wheel and one sdist: {wheels} {sdists}"

          with zipfile.ZipFile(wheels[0]) as z:
              name = next(n for n in z.namelist() if n.endswith(".dist-info/METADATA"))
              wheel_version = HeaderParser().parsestr(z.read(name).decode())["Version"]
          with tarfile.open(sdists[0]) as t:
              name = next(n for n in t.getnames() if n.count("/") == 1 and n.endswith("/PKG-INFO"))
              sdist_version = HeaderParser().parsestr(t.extractfile(name).read().decode())["Version"]

          tag = os.environ["TAG"]
          print(f"tag {tag}, wheel {wheel_version}, sdist {sdist_version}")
          assert wheel_version == sdist_version, "wheel and sdist versions differ"
          if tag != "v" + wheel_version:
              raise SystemExit(f"::error::tag {tag} does not match the package version {wheel_version}")
          version = Version(wheel_version)
          if str(version) != wheel_version or version.local is not None:
              raise SystemExit(f"::error::{wheel_version} is not a normalized public version")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"version={wheel_version}\n")
              f.write(f"dev={str(version.is_devrelease).lower()}\n")
          print("development release: TestPyPI only" if version.is_devrelease
                else "release: TestPyPI, then PyPI")
          '
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: testpypi
      url: https://test.pypi.org/project/openntn/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    name: Publish to PyPI
    # Also runs when the TestPyPI job failed: TestPyPI has no availability guarantee,
    # and PyPI rejects an invalid upload without using up the version. The deployment
    # still waits for the maintainer's approval in the environment pypi; after a failed
    # TestPyPI job it is approved only if TestPyPI's availability was the cause.
    needs: [build, testpypi]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.build.outputs.dev == 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/openntn/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
